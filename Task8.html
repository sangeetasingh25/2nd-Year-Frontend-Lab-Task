
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 8 - DOM Applications</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0e7ff, #f5eaff);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #292b55;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            color: #373b70;
            margin-bottom: 20px;
        }

        /* TO-DO LIST */

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #6c63ff;
        }

        button {
            border: none;
            padding: 10px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn {
            background: #6c63ff;
            color: white;
        }

        .add-btn:hover {
            background: #5148d9;
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px;
            background: #f5f5ff;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #6c63ff;
        }

        .task-text {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #6c63ff;
        }

        .move-btn {
            background: #e0e0ff;
            color: #4941b5;
        }

        .delete-btn {
            background: #ffe0e0;
            color: red;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* CHESSBOARD */

        .chess-section {
            text-align: center;
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: min(100%, 480px);
            aspect-ratio: 1 / 1;
            border: 5px solid black;
            margin: 20px auto;
        }

        .box {
            width: 100%;
            aspect-ratio: 1 / 1;
        }

        footer {
            text-align: center;
            color: #777;
            padding: 10px;
        }

        @media (max-width: 500px) {

            .section {
                padding: 20px 12px;
            }

            .input-area {
                flex-direction: column;
            }

            li {
                gap: 6px;
                padding: 9px 6px;
            }

            li button {
                padding: 7px;
            }

        }

    </style>
</head>

<body>

    <div class="container">

        <h1>DOM Applications</h1>

        <p class="subtitle">
            Advanced JavaScript Practice | Task 8
        </p>


        <!-- TO-DO LIST -->

        <div class="section">

            <h2>📝 My To-Do List</h2>

            <div class="input-area">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter your task..."
                >

                <button class="add-btn" id="addBtn">
                    + Add Task
                </button>

            </div>

            <ul id="taskList"></ul>

        </div>


        <!-- CHESSBOARD -->

        <div class="section chess-section">

            <h2>♟ Chessboard</h2>

            <div class="chessboard" id="board"></div>

        </div>


        <footer>
            Created using HTML, CSS and JavaScript
        </footer>

    </div>


    <script>

       
        // PART 1: TO-DO LIST
       

        let taskInput = document.getElementById("taskInput");

        let taskList = document.getElementById("taskList");

        let addBtn = document.getElementById("addBtn");


        

        function updateButtons() {

            let tasks = taskList.children;

            for (let i = 0; i < tasks.length; i++) {

                let buttons = tasks[i].querySelectorAll(".move-btn");

                buttons[0].disabled = (i === 0);

                buttons[1].disabled = (i === tasks.length - 1);

            }

        }


       

        function addTask() {

            let taskValue = taskInput.value.trim();

            if (taskValue === "") {

                alert("Please enter a task!");

                return;

            }


            let li = document.createElement("li");


            

            let checkbox = document.createElement("input");

            checkbox.type = "checkbox";



            let span = document.createElement("span");

            span.className = "task-text";

            span.textContent = taskValue;


           

            checkbox.addEventListener("change", function() {

                if (checkbox.checked) {

                    span.classList.add("completed");

                }
                else {

                    span.classList.remove("completed");

                }

            });


           

            let upBtn = document.createElement("button");

            upBtn.textContent = "↑";

            upBtn.className = "move-btn";

            upBtn.addEventListener("click", function() {

                let previous = li.previousElementSibling;

                if (previous !== null) {

                    taskList.insertBefore(li, previous);

                    updateButtons();

                }

            });


           

            let downBtn = document.createElement("button");

            downBtn.textContent = "↓";

            downBtn.className = "move-btn";

            downBtn.addEventListener("click", function() {

                let next = li.nextElementSibling;

                if (next !== null) {

                    taskList.insertBefore(next, li);

                    updateButtons();

                }

            });


           

            let deleteBtn = document.createElement("button");

            deleteBtn.textContent = "X";

            deleteBtn.className = "delete-btn";

            deleteBtn.addEventListener("click", function() {

                li.remove();

                updateButtons();

            });


           

            li.appendChild(checkbox);

            li.appendChild(span);

            li.appendChild(upBtn);

            li.appendChild(downBtn);

            li.appendChild(deleteBtn);


            taskList.appendChild(li);

            taskInput.value = "";

            updateButtons();

        }


        

        addBtn.addEventListener("click", addTask);


        taskInput.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                addTask();
            }
        });
        let initialTasks = [
            "Complete JavaScript assignment",
            "Practice DOM manipulation",
            "Study for end semester"
        ];
        for (let i = 0; i < initialTasks.length; i++) {
            taskInput.value = initialTasks[i];
            addTask();
        }
        taskInput.value = "";


        
        // PART 2: CHESSBOARD
        

        let board = document.getElementById("board");
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                let box = document.createElement("div");
                box.classList.add("box");
                if ((row + col) % 2 == 0) {
                    box.style.backgroundColor = "white";
                }
                else {
                    box.style.backgroundColor = "black";
                }
                board.appendChild(box);
            }
        }

    </script>

</body>

</html>
